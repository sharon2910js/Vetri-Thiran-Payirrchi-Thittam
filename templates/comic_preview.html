<<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ comic.title }}</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .panel {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        .panel h2 {
            margin-top: 0;
        }

        .panel img {
            display: block;
            width: 100%;
            max-width: 700px;
            margin: 15px auto;
            border-radius: 8px;
        }

        .dialogue {
            padding: 12px;
            background: #f0f0f0;
            border-radius: 8px;
        }

        .export-section {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 30px;
        }

        .export-button {
            display: inline-block;
            padding: 14px 25px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .export-button:hover {
            opacity: 0.8;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>{{ comic.title }}</h1>


    {% for panel in comic.panels %}

    <div class="panel">

        <h2>
            Panel {{ panel.panel_number }}:
            {{ panel.title }}
        </h2>


        {% if panel.image_url %}

            <img
                src="{{ panel.image_url }}"
                alt="Comic Panel {{ panel.panel_number }}"
            >

        {% endif %}


        <p>
            {{ panel.scene_description }}
        </p>


        {% if panel.dialogue %}

        <div class="dialogue">

            <strong>Dialogue:</strong>

            {{ panel.dialogue }}

        </div>

        {% endif %}

    </div>

    {% endfor %}


    <div class="export-section">

        <a
            href="{{ comic.pdf_url }}"
            class="export-button"
            download
        >
            📥 Export / Download PDF
        </a>

    </div>

</div>

</body>

</html>

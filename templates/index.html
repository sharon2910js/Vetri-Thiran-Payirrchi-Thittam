<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ComicCraft | AI Comic Creator</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>


<body class="home">


<main class="container hero">


    <!-- INTRO -->

    <section class="card intro">

        <span class="badge">
            GEMINI + AI ART
        </span>


        <h1>
            Comic<span>Craft</span>
        </h1>


        <p>
            Turn your story idea into a
            five-panel AI-generated comic.
        </p>

    </section>



    <!-- FORM -->

    <form
        class="card form-card"
        action="/generate"
        method="post"
    >


        <label>

            Story Prompt

            <textarea
                name="story_prompt"
                required
                minlength="3"
                placeholder="A brave fox discovers a secret door in an enchanted forest..."
            ></textarea>

        </label>



        <div class="grid">


            <label>

                Main Character

                <input
                    type="text"
                    name="character_name"
                    required
                    placeholder="Milo"
                >

            </label>



            <label>

                Setting

                <select name="setting">

                    <option>
                        Enchanted Forest
                    </option>

                    <option>
                        School
                    </option>

                    <option>
                        Future City
                    </option>

                    <option>
                        Outer Space
                    </option>

                    <option>
                        Underwater World
                    </option>

                </select>

            </label>


        </div>



        <div class="grid">


            <label>

                Story Tone

                <select name="tone">

                    <option>
                        Funny
                    </option>

                    <option>
                        Light-hearted
                    </option>

                    <option>
                        Dramatic
                    </option>

                    <option>
                        Adventure
                    </option>

                    <option>
                        Poetic
                    </option>

                </select>

            </label>



            <label>

                Art Style

                <select name="art_style">

                    <option>
                        Comic Book
                    </option>

                    <option>
                        Anime
                    </option>

                    <option>
                        Pixel Art
                    </option>

                    <option>
                        Watercolor
                    </option>

                    <option>
                        Graphic Novel
                    </option>

                </select>

            </label>


        </div>



        <button
            type="submit"
            class="primary"
        >

            ✨ Generate My Comic

        </button>


        <p class="hint">

            AI image generation may take
            a few minutes.

        </p>


    </form>


</main>


</body>

</html>
